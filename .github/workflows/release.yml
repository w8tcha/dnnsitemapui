name: Release

on:
  push:
    branches: [master]
    paths:
      - "Source/Installation/SiteMap.dnn"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version and release status
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$dnn = Get-Content "Source/Installation/SiteMap.dnn"
          $version = $dnn.dotnetnuke.packages.package[0].version
          $tag = "v$version"
          Write-Host "Package version: $version (tag: $tag)"

          $existingTags = @(gh release list --limit 200 --json tagName --jq ".[].tagName")

          $alreadyReleased = $existingTags -contains $tag

          $currentVer = [version]$version
          $maxVer = $null
          foreach ($t in $existingTags) {
            $clean = $t.TrimStart("v")
            try {
              $v = [version]$clean
              if (-not $maxVer -or $v -gt $maxVer) { $maxVer = $v }
            } catch {
              Write-Host "Skipping non-version tag: $t"
            }
          }

          $isNewer = (-not $maxVer) -or ($currentVer -gt $maxVer)
          $shouldRelease = (-not $alreadyReleased) -and $isNewer

          Write-Host "Already released: $alreadyReleased"
          Write-Host "Latest existing release version: $maxVer"
          Write-Host "Is newer: $isNewer"
          Write-Host "Should release: $shouldRelease"

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "should_release=$($shouldRelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Setup MSBuild
        if: steps.version.outputs.should_release == 'true'
        uses: microsoft/setup-msbuild@v3

      - name: Build Deploy package
        if: steps.version.outputs.should_release == 'true'
        run: msbuild Source/SiteMap.csproj /restore /p:Configuration=Deploy /p:Platform=AnyCPU /m

      - name: Verify deploy artifacts
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $zips = Get-ChildItem -Path deploy -Filter "*_$($env:VERSION).zip" -ErrorAction SilentlyContinue
          if (-not $zips) {
            Write-Error "No deploy zip files found for version $($env:VERSION) in the deploy folder."
            exit 1
          }
          $zips | ForEach-Object { Write-Host "Found artifact: $($_.FullName)" }
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build release notes from commits
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: |
          # Commits since the last release tag (tags are fetched, checkout uses fetch-depth: 0)
          $previousTag = git describe --tags --abbrev=0 2>$null
          $range = if ($previousTag) { "$previousTag..HEAD" } else { "HEAD" }
          Write-Host "Commit range: $range"

          # Subject lines without merge commits and without dependabot updates
          $commits = git log $range --no-merges --pretty=format:"%an%x09- %s (%h)" |
            Where-Object { $_ -and ($_.Split("`t")[0] -notmatch 'dependabot') } |
            ForEach-Object { $_.Split("`t", 2)[1] }

          $notes = "## Changes`n`n"
          $notes += if ($commits) { ($commits -join "`n") } else { "- No changes" }
          $notes += "`n"

          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          Get-Content release-notes.md

      - name: Create GitHub release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" deploy/*_${{ steps.version.outputs.version }}*.zip --title "${{ steps.version.outputs.tag }}" --notes-file release-notes.md --generate-notes
